name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, regression tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      VERCEL_ENV: production
      GOCAR_ENABLE_MOCK_FALLBACK: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Brand/contact source guard
        shell: bash
        run: |
          set -euo pipefail
          fail=0

          check_forbidden() {
            local label="$1"
            local pattern="$2"
            if grep -RniF -- "$pattern" src; then
              echo "::error::$label"
              fail=1
            fi
          }

          check_forbidden "Legacy brand found in src" "Xe Miền Nam"
          check_forbidden "Retired public brand found in src" "Gocar VN"
          check_forbidden "Retired compact brand found in src" "GOCARVN"
          check_forbidden "Legacy hotline found in src" "1900 6789"
          check_forbidden "Legacy hotline URI found in src" "19006789"

          for pattern in "0898 400 800" "0898400800" "+84898400800"; do
            if grep -RniF --exclude="site-config.ts" -- "$pattern" src; then
              echo "::error::Hotline literal must be centralized in src/lib/site-config.ts: $pattern"
              fail=1
            fi
          done

          exit "$fail"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Day 50 private empty-leg model and time/price/reference guards
        run: |
          npm run test:empty-leg
          npm run test:empty-leg:php
          php -l wordpress/gocar-core/includes/class-gocar-empty-leg.php

      - name: Day 49 directional airport consultation and readiness guards
        run: npm run test:airport-consultation

      - name: Day 48 approved airport timing and flight validation
        run: |
          npm run test:airport-timing
          npm run test:airport-timing:php
          php -l wordpress/gocar-core/includes/class-gocar-airport-timing.php

      - name: Day 47 vehicle selector transport and verified display
        run: npm run test:vehicle-selector

      - name: Day 46 confirmed vehicle facts and loading suggestions
        run: |
          npm run test:vehicle-facts
          npm run test:vehicle-facts:php
          php -l wordpress/gocar-core/includes/class-gocar-vehicle-facts.php

      - name: Day 42 promotion model and private WordPress persistence
        run: |
          npm run test:promotion-model
          npm run test:promotion-model:php

      - name: Day 45 immutable promotion snapshot and replay
        run: |
          npm run test:promotion-snapshot
          npm run test:promotion-snapshot:php
          php -l wordpress/gocar-core/includes/class-gocar-promotion-snapshot.php
          php -l wordpress/gocar-core/includes/class-gocar-lead-lifecycle.php

      - name: Day 44 promotion presentation and expiry
        run: npm run test:promotion-presentation

      - name: Day 43 promotion evaluator
        run: |
          npm run test:promotion-evaluator
          npm run test:promotion-surcharge:php
          php -l wordpress/gocar-core/includes/class-gocar-service-area.php
          php -l wordpress/gocar-core/gocar-core.php

      - name: Location migration regression tests
        run: npm run test:location-migration

      - name: Airport Hub audit regression tests
        run: npm run test:airport-hub-audit

      - name: Blog semantic relation regression guard
        run: npm run test:blog-relations

      - name: Metadata regression guard
        run: npm run test:metadata

      - name: Indexability regression guard
        run: npm run test:indexability

      - name: Schema pricing regression guard
        run: npm run test:schema-pricing

      - name: Footer link regression guard
        run: npm run test:footer

      - name: Booking pickup/dropoff regression guard
        run: npm run test:booking-pickup-dropoff

      - name: Service zone and surcharge regression guard
        run: npm run test:service-zones

      - name: Multi-stop booking regression guard
        run: npm run test:multi-stop

      - name: Price rules regression guard
        run: npm run test:price-rules

      - name: Price conditions regression guard
        run: npm run test:price-conditions

      - name: SEO URL map behavioral fixtures
        run: npm run test:seo-url-map

      - name: Booking search regression guard
        run: npm run test:booking-search

      - name: Route direction and package navigation
        run: node --test scripts/route-journey-selection.test.mjs

      - name: Sitemap lastmod date validity
        run: node --test scripts/sitemap-lastmod.test.mjs

      - name: Day 36B brand, pricing UI and Content Readiness guard
        run: npm run test:day36b

      - name: Day 36B public location display regression guard
        run: npm run test:location-display

      - name: Admin wizard source guard
        run: npm run test:admin-wizard

      - name: Day 37 lead retry idempotency
        run: npm run test:lead-idempotency

      - name: SEO-006A package and lead response fixtures
        run: npm run test:seo006a-core

      - name: Public CMS pricing tuples
        run: npm run test:public-pricing

      - name: WordPress API failure and recovery
        run: node --test scripts/wp-fetch-resilience.test.mjs scripts/wp-revalidate.test.mjs

      - name: Production build
        run: npm run build

      - name: Built and request-rendered public HTML
        env:
          HTML_AUDIT_BASE_URL: http://127.0.0.1:3100
        shell: bash
        run: |
          node node_modules/next/dist/bin/next start --port 3100 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3100/api/revalidate >/dev/null; then break; fi
            sleep 1
          done
          node --test scripts/promotion-http.test.mjs scripts/seo006b-listing-html.test.mjs scripts/gocar-public-price-html.test.mjs scripts/gocar-location-display-output.test.mjs
