name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, regression tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      VERCEL_ENV: production
      GOCAR_ENABLE_MOCK_FALLBACK: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Brand/contact source guard
        shell: bash
        run: |
          set -euo pipefail
          fail=0

          check_forbidden() {
            local label="$1"
            local pattern="$2"
            if grep -RniF -- "$pattern" src; then
              echo "::error::$label"
              fail=1
            fi
          }

          check_forbidden "Legacy brand found in src" "Xe Miền Nam"
          check_forbidden "Legacy hotline found in src" "1900 6789"
          check_forbidden "Legacy hotline URI found in src" "19006789"

          for pattern in "0898 400 800" "0898400800" "+84898400800"; do
            if grep -RniF --exclude="site-config.ts" -- "$pattern" src; then
              echo "::error::Hotline literal must be centralized in src/lib/site-config.ts: $pattern"
              fail=1
            fi
          done

          exit "$fail"

      - name: Lint
        run: npm run lint

      - name: Location migration regression tests
        run: npm run test:location-migration

      - name: Airport Hub audit regression tests
        run: npm run test:airport-hub-audit

      - name: Blog semantic relation regression guard
        run: npm run test:blog-relations

      - name: Metadata regression guard
        run: npm run test:metadata

      - name: Indexability regression guard
        run: npm run test:indexability

      - name: Schema pricing regression guard
        run: npm run test:schema-pricing

      - name: Footer link regression guard
        run: npm run test:footer

      - name: Production build
        run: npm run build
